services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["uv", "run", "celery", "-A", "backend.app.tasks", "worker", "--loglevel=info"]
    depends_on:
      - redis
